name: ATLAS regression checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated stdlib regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Installer shell syntax
        run: bash -n scripts/install-workspace.sh
      - name: Reproduce pinned security fixture comparison
        run: python scripts/compare_security.py
