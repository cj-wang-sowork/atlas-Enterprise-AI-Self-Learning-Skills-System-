name: ATLAS regression checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned optional identity dependencies
        run: |
          python -m pip install -r integrations/requirements-oidc.txt
          python -m pip check
      - name: Full acceptance suite (identity lane must not skip)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -c 'import jwt, cryptography, unittest; s=unittest.defaultTestLoader.discover("tests"); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(0 if r.wasSuccessful() and r.testsRun >= 103 and not r.skipped else 1)'
      - name: Authenticated subprocess restart acceptance (synthetic IdP)
        run: python examples/authenticated-team/demo.py --evidence "$RUNNER_TEMP/atlas-identity-evidence.json"
      - name: Verify frozen real-model pilot artifacts (no model calls)
        run: python -m evaluation.paired verify studies/paired-pilot/run-20261017
      - name: Installer shell syntax
        run: bash -n scripts/install-workspace.sh
      - name: Reproduce pinned security fixture comparison
        run: python scripts/compare_security.py
